name: CICD execute on Selfhosted Runner 
on: push
jobs:
  CICD-job:
   continue-on-error: true 
   runs-on: self-hosted
   steps:
   - name: Checkout code on the VM
     uses: actions/checkout@v7
   - name: Install Java 
     uses: actions/setup-java@v5
      with:
       distribution: temurin
       java-version: '17'
   - name: Setup Docker 
     uses: docker/setup-buildx-action@v4
