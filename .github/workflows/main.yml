name: CI with java using maven
on: push

jobs:
  buildjob:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        
      - name: Install Java and Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: compile code
        run: mvn compile

      - name: Test the code
        run: mvn test

      - name: Package the code 
        run: mvn package

      - name: Upload artifact to repo
        uses: actions/upload-artifact@v7
        with:
             name: buildfile
             path: /home/runner/work/MavenBuild-SL/MavenBuild-SL/target/

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=sonarqube-githubaction-aug2026_sonarcudedemo-github
            -Dsonar.organization=sonarqube-githubaction-aug2026
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
