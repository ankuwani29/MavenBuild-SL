
name: CICD pipeline using maven and docker
on: push
jobs:
  CICDJob:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout code
     uses: actions/checkout@v7
   - name: Set up Java and maven
     uses: actions/setup-java@v5
     with:
       distribution: 'temurin'
       java-version: '17' 
   - name: Install docker
     uses: docker/setup-buildx-action@v4
   - name: Continuous integration - Maven Build- generate the WAR file in target folder
     run: mvn package
   - name: Continuous Delivery - Login to Dockerhub
     uses: docker/login-action@v4
     with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
   - name: Continuous Delivery - Build and push Docker image to Dockerhub
     uses: docker/build-push-action@v7
     with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myjavaproject:latest


        
